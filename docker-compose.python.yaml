services:
  python:
    container_name: python

    build:
      #context: ./docker_python
      #dockerfile: ./Dockerfile.python
      dockerfile: ./docker_files/Dockerfile.python
    
    #keep the container running
    command: tail -f /dev/null

    volumes:
      #create a volume to export files as output and logs
      - ./output:/app/output
      - ./python_source:/app/python_source
      - ./logs:/app/logs

    networks:
      - data_net
    #depends_on:
    #  - sqlserver
    #  - postgres
    environment:
      PATH: "/app/.venv/bin:$PATH"
      
      SQL_SERVER_HOST: ${SQL_SERVER_HOST}
      SQL_SERVER_USER: ${SQL_SERVER_USER}
      SQL_SERVER_PASSWORD: ${SQL_SERVER_PASSWORD}
      SQL_SERVER_DB: ${SQL_SERVER_DB}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  data_net:



