services:
  data_pipeline:
    container_name: data_pipeline

    build:
      context: ./python_pipelines
      dockerfile: ./Dockerfile.python
    
    #keep the container running
    command: tail -f /dev/null

    volumes:
      #create a volume to export files as output and logs
      - ./output:/app/output

    networks:
      - data_net
    #depends_on:
    #  - sqlserver
    #  - postgres
    environment:
      PATH: "/app/.venv/bin:$PATH"
      
      SQL_SERVER_HOST: ${SQL_SERVER_HOST}
      SQL_SERVER_USER: ${SQL_SERVER_USER}
      SQL_SERVER_PASSWORD: ${SA_PASSWORD}
      SQL_SERVER_DB: ${SQL_SERVER_DB}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  data_net:



