services:
  python_ingestion:
    container_name: python_ingestion
    build:
      context: ./python_ingestion
      dockerfile: ./Dockerfile
    #keep the container running - for testing
    command: tail -f /dev/null

    volumes:
      #create a volume to export files as output and logs
      - ./output:/app/output

    networks:
      - data_net
    depends_on:
      - sqlserver
      - postgres
    environment:
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_USER: sa
      SQL_SERVER_PASSWORD: ${SA_PASSWORD}
      SQL_SERVER_DB: WideWorldImporters
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: my_warehouse
networks:
  data_net: