services:
#---------------------------------------------------------------------
#define first container to run SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # password as an enviroment parameter
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD} 
    ports:
      - "1433:1433"
      #defining volumes to access data outside of the container
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./data_source_bak:/var/opt/mssql/backup
      #create a network to link containers
    networks:
      - data_net
#---------------------------------------------------------------------
  # second container to run an application to interact with SQL Server
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - data_net
#---------------------------------------------------------------------
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
    volumes:
      - postgres_warehouse:/var/lib/postgresql
    ports:
      - "1434:1434"
    networks:
      - data_net
#---------------------------------------------------------------------
#---------------------------------------------------------------------
# define volumes as external and configure the names
  # need to create the volumes in bash "docker volume create 'volume_name' "
volumes:
  sqlserver_data:
    external: true
    name: sql_server_ERP
  cloudbeaver_data:
    external: true
    name: dbeaver_cred
  postgres_warehouse:
    external: true
    name: postgres_warehouse
#---------------------------------------------------------------------
networks:
  data_net: